name: fetch
on:
  schedule:
    - cron: "30 22 * * *"   # UTC 22:30 = 台北 06:30
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finmind-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run fetch
        run: python scripts/finmind_trial.py fetch
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "finmind-trial-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "fetch results $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
