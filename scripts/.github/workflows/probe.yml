name: probe
on:
  schedule:
    - cron: "0,30 20-23 * * *"   # 台北 04:00–07:30，每 30 分鐘
    - cron: "0 0 * * *"          # 台北 08:00
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finmind-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run probe
        run: python scripts/finmind_trial.py probe
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "finmind-trial-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "probe $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
